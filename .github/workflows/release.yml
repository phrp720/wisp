name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: cli
      - name: Compile for every platform
        run: |
          cd cli && bun scripts/compile.ts darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64
          cd .. && mkdir -p release && mv cli/bin/wisp-* release/
          cd release && sha256sum * > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
