name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Nothing should open on a CI machine, whatever it thinks its display is.
      WISP_HEADLESS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The unit tests are written against POSIX paths and processes; Windows is covered by
      # the build and the smoke test below until they are made path-neutral.
      - if: runner.os != 'Windows'
        run: pnpm test
      - run: pnpm build
      - name: Smoke test the CLI
        shell: bash
        run: |
          node cli/dist/bin/wisp.js --version
          node cli/dist/bin/wisp.js doctor
          node cli/dist/bin/wisp.js check
          node cli/dist/bin/wisp.js "Check everything" --dry-run
          node cli/dist/bin/wisp.js spec > /dev/null

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm website:build
      - name: Lint the install script
        run: shellcheck website/public/install.sh

